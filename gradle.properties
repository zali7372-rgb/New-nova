# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# NOVA build-time configuration.
# NEVER put real secrets here. This file is committed to git.
# Real keys belong in local.properties (gitignored) or CI secrets.
# See README.md -> "AI Provider Configuration".
NOVA_DEFAULT_AI_PROVIDER=local
