name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's ubuntu-latest runners already ship with an Android SDK
      # preinstalled (cmdline-tools + platform-tools). We deliberately do NOT
      # use the android-actions/setup-android action here: as of this
      # writing it defaults to installing a package literally called "tools",
      # which Google discontinued years ago (superseded by cmdline-tools) -
      # that step fails with "Warning: Failed to find package 'tools'" and
      # aborts the whole job. Accepting the licenses is all that's actually
      # needed; Gradle/AGP downloads whatever specific platform and
      # build-tools versions the project requires automatically during the
      # build itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, bootstrapping with system Gradle..."
            gradle wrapper --gradle-version 8.9
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
